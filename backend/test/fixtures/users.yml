<% token = ->(label) { "#{ActiveRecord::FixtureSet.identify(label)}:#{Devise.friendly_token}" } %>
user_one:
  username: test
  email: test@test.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password") %>
  access_token: <%= token.(:user_one) %>

user_two:
  username: test_two
  email: test_two@test.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password2") %>
  access_token: <%= token.(:user_two) %>
